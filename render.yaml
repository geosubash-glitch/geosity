# Render Blueprint for the Moodboard app in moodboard/.
# Render dashboard -> New -> Blueprint -> pick this repo. It asks for an app password.
# Optional: add ANTHROPIC_API_KEY later under Environment to let Claude pick the shots.
services:
  - type: web
    name: reel-moodboard
    runtime: docker
    plan: free
    dockerfilePath: ./moodboard/Dockerfile
    dockerContext: ./moodboard
    healthCheckPath: /healthz
    envVars:
      - key: APP_PASSWORD
        sync: false
      - key: SECRET_KEY
        generateValue: true
