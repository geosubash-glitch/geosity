<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Kondapalli · Little toys. Big stories.</title>
<meta name="description" content="Meet the artisan who made the figures in your Kondapalli book.">
<meta property="og:type" content="website">
<meta property="og:title" content="Kondapalli · Little toys. Big stories.">
<meta property="og:description" content="Meet the artisan behind the figures in your Kondapalli book.">
<meta property="og:url" content="https://geosubash-glitch.github.io/geosity/kondapalli/">
<meta name="twitter:card" content="summary">
<link rel="preload" href="fonts/inter-latin-400-normal.woff2" as="font" type="font/woff2" crossorigin>
<link rel="preload" href="fonts/nunito-latin-800-normal.woff2" as="font" type="font/woff2" crossorigin>
<meta name="theme-color" content="#fffaec">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%23275c47'/%3E%3Ctext x='32' y='45' font-size='36' font-weight='800' text-anchor='middle' fill='%23fffaec' font-family='sans-serif'%3EK%3C/text%3E%3C/svg%3E">
<style>
@font-face{font-family:'Inter';font-weight:400;font-display:swap;src:url(fonts/inter-latin-400-normal.woff2) format('woff2')}
@font-face{font-family:'Inter';font-weight:500;font-display:swap;src:url(fonts/inter-latin-500-normal.woff2) format('woff2')}
@font-face{font-family:'Inter';font-weight:600;font-display:swap;src:url(fonts/inter-latin-600-normal.woff2) format('woff2')}
@font-face{font-family:'Nunito';font-weight:700;font-display:swap;src:url(fonts/nunito-latin-700-normal.woff2) format('woff2')}
@font-face{font-family:'Nunito';font-weight:800;font-display:swap;src:url(fonts/nunito-latin-800-normal.woff2) format('woff2')}
@font-face{font-family:'Noto Sans Telugu';font-weight:400;font-display:swap;src:url(fonts/noto-sans-telugu-telugu-400-normal.woff2) format('woff2');unicode-range:U+0C00-0C7F,U+0951-0952,U+0964-0965,U+1CDA,U+200C-200D,U+25CC}
@font-face{font-family:'Noto Sans Telugu';font-weight:500;font-display:swap;src:url(fonts/noto-sans-telugu-telugu-500-normal.woff2) format('woff2');unicode-range:U+0C00-0C7F,U+0951-0952,U+0964-0965,U+1CDA,U+200C-200D,U+25CC}
:root{
  --green:#275c47; --ink:#293f38; --muted:#596b62;
  --cream:#fffaec; --sage:#eef3ea; --line:#e7e9df; --chip:#eef0e6;
  --yellow:#f7e5a8; --white:#fff;
  --head:'Nunito','Avenir Next','Segoe UI',system-ui,sans-serif;
  --body:'Inter','Noto Sans Telugu',system-ui,-apple-system,'Segoe UI',sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0}
html{-webkit-text-size-adjust:100%}
body{font-family:var(--body);color:var(--muted);background:#f3f2ea;min-height:100vh;display:flex;justify-content:center}
.app{width:100%;max-width:480px;min-height:100vh;background:var(--cream);position:relative;display:flex;flex-direction:column}
@media(min-width:520px){body{padding:28px 0}.app{min-height:0;border-radius:28px;box-shadow:0 1px 2px rgba(0,0,0,.05),0 12px 40px rgba(41,63,56,.10);overflow:hidden}}
header{padding:28px 22px 0}
.brand{font-family:var(--head);font-weight:800;font-size:30px;color:var(--green);line-height:1.1}
.tag{font-size:14px;font-weight:500;margin-top:4px}
nav{display:flex;background:var(--chip);border-radius:16px;padding:5px;margin:20px 0 4px}
nav a{flex:1;text-align:center;text-decoration:none;font-weight:500;font-size:16px;color:var(--ink);padding:12px 0;border-radius:12px}
nav a.on{background:var(--green);color:#fff;font-weight:600}
main{flex:1;padding:0 22px 8px}
.view{display:none}
.view.on{display:block;animation:in .25s ease}
@keyframes in{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
h1,h2,h3{font-family:var(--head);font-weight:800;color:var(--ink)}
.kick{font-size:12px;font-weight:600;letter-spacing:.09em;text-transform:uppercase;color:var(--green)}
/* landing */
#home .kick{margin-top:26px}
#home h1{font-size:38px;line-height:1.1;margin-top:10px}
#home p.lead{font-size:17px;line-height:1.5;margin-top:14px;max-width:310px}
.row{display:flex;justify-content:space-between;align-items:baseline;margin-top:34px}
.row h2{font-size:25px}
.row span{font-size:14px;font-weight:500}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-top:16px}
.card{display:block;text-decoration:none;background:#fff;border:1px solid var(--line);border-radius:20px;padding:9px 9px 14px}
.card img{width:100%;display:block;aspect-ratio:422/320;object-fit:cover;border-radius:14px}
.card .meta{display:flex;justify-content:space-between;align-items:center;padding:12px 6px 0}
.card b{font-family:var(--head);font-weight:700;font-size:19px;color:var(--ink);display:block}
.card small,.bookcard small{font-size:13px;color:var(--muted)}
.card i{font-style:normal;font-size:22px;color:var(--green)}
.card:active{transform:scale(.98)}
.more{text-align:center;font-size:13px;font-weight:500;margin:24px 0 8px}
/* craft */
#craft{margin:0 -22px;padding:24px 22px 8px;background:var(--sage)}
#root .view{padding-bottom:6px}
#craft .chip{display:inline-block;background:var(--chip);border-radius:99px;padding:9px 16px;font-size:12px;font-weight:600;letter-spacing:.09em;color:var(--green)}
#craft h1{font-size:36px;line-height:1.14;margin-top:20px}
#craft .where{font-size:15px;font-weight:600;color:var(--green);margin-top:16px}
#craft .intro{font-size:16.5px;line-height:1.6;margin-top:14px}
.panel{background:#fff;border-radius:22px;padding:22px 20px 14px;margin-top:28px}
.panel h2{font-size:24px}
.step{display:flex;gap:14px;margin-top:20px;align-items:flex-start}
.step em{flex:none;width:40px;height:40px;border-radius:12px;display:grid;place-items:center;font-style:normal;font-weight:600;font-size:14px;color:var(--green)}
.step:nth-of-type(1) em{background:#e4efe6}.step:nth-of-type(2) em{background:#fbe3d6}.step:nth-of-type(3) em{background:#e4efe6}
.step b{display:block;font-weight:600;font-size:16px;color:var(--ink)}
.step span{font-size:14.5px;line-height:1.45;display:block;margin-top:2px}
.panel .step:last-child{margin-bottom:10px}
.together{background:var(--yellow);border-radius:22px;padding:20px;margin-top:18px}
.together h3{font-size:21px}
.together p{font-size:14.5px;line-height:1.5;color:var(--ink);margin-top:8px}
.foot{text-align:center;font-size:13px;font-weight:500;color:var(--green);padding:26px 0 18px}
/* artisan */
.back{display:inline-block;margin-top:18px;color:var(--green);font-weight:500;font-size:15px;text-decoration:none}
#artisan .kick{margin-top:22px}
.portrait{width:100%;display:block;aspect-ratio:967/691;object-fit:cover;border-radius:20px;margin-top:14px}
#artisan h1{font-size:34px;margin-top:18px}
.role{font-size:14.5px;margin-top:4px}
#artisan h2{font-size:23px;margin-top:30px}
#artisan p.bio{font-size:15.5px;line-height:1.6;margin-top:10px}
.btn{display:block;width:100%;font:600 16px var(--body);border-radius:14px;padding:17px;margin-top:14px;cursor:pointer;text-align:center}
.btn.fill{background:var(--green);color:#fff;border:1.5px solid var(--green);margin-top:26px}
.btn.line{background:transparent;color:var(--green);border:1.5px solid var(--green)}
.note{font-size:13.5px;line-height:1.45;background:#fff;border:1px solid var(--line);border-radius:12px;padding:12px 14px;margin-top:10px;display:none}
.note.on{display:block}
footer{text-align:center;font-size:12.5px;padding:10px 22px 26px}
footer a{color:var(--green)}
.tabbar{display:none}

.bookcard{display:flex;gap:14px;background:#fff;border:1px solid var(--line);border-radius:20px;padding:10px;text-decoration:none;margin-top:14px;align-items:center}
.bookcard img{width:44%;aspect-ratio:213/154;object-fit:cover;border-radius:12px}
.bookcard b{font-family:var(--head);font-weight:800;font-size:19px;color:var(--ink);display:block;line-height:1.2}
.bookcard small{font-size:13px;display:block;margin-top:6px}
.cover{width:100%;display:block;border-radius:20px;margin-top:16px}
.lesson{background:var(--yellow);border-radius:20px;padding:18px 20px;margin-top:22px}
.lesson b{font-family:var(--head);font-weight:800;font-size:18px;color:var(--ink);display:block}
.lesson p{font-size:15px;line-height:1.5;color:var(--ink);margin-top:6px}
.madeby{display:flex;gap:14px;align-items:center;background:#fff;border:1px solid var(--line);border-radius:20px;padding:12px;text-decoration:none;margin-top:14px}
.madeby img{width:76px;height:76px;border-radius:14px;object-fit:cover}
.madeby b{font-family:var(--head);font-weight:800;font-size:19px;color:var(--ink);display:block}
.madeby small{font-size:13.5px}
.madeby i{margin-left:auto;font-style:normal;font-size:22px;color:var(--green)}
.big{width:100%;display:block;aspect-ratio:422/320;object-fit:cover;border-radius:20px;margin-top:14px}
.from{display:block;margin-top:8px;font-size:15px;color:var(--green);font-weight:500;text-decoration:none}
.sub{font-size:23px;margin-top:32px}
.grid.three{grid-template-columns:1fr 1fr}

a,button{-webkit-tap-highlight-color:transparent}
img{height:auto;max-width:100%}
.madeby img{height:76px}
.madeby small{color:var(--muted)}
a:focus-visible,button:focus-visible{outline:3px solid #275c47;outline-offset:3px;border-radius:10px}
h1:focus{outline:none}
.skip{position:absolute;left:-999px;top:8px;background:var(--green);color:#fff;padding:10px 14px;border-radius:10px;z-index:9}
.skip:focus{left:12px}
nav a{min-height:44px;display:flex;align-items:center;justify-content:center}
.back{display:inline-flex;align-items:center;gap:6px;padding:12px 0 4px;margin-top:6px}
.ic{width:18px;height:18px;flex:none;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.card .ic,.madeby .ic{color:var(--green);width:22px;height:22px;margin-left:auto}
.card .meta{gap:6px}
.card:hover,.bookcard:hover,.madeby:hover{border-color:#cfd6c8}

.bookhead{display:flex;gap:14px;align-items:center;margin-top:16px}
.bookhead img{width:38%;border-radius:12px;flex:none}
.bookhead p{font-size:15px;line-height:1.5}
.together p+p{margin-top:12px}
.notfound{padding:40px 0 20px}
.notfound h1{font-size:30px}
.notfound p{margin-top:10px;font-size:16px;line-height:1.5}
.notfound .btn{margin-top:22px;text-decoration:none}
a.btn{text-decoration:none}
@media(prefers-reduced-motion:reduce){.view.on{animation:none}.card:active{transform:none}}
footer{padding-bottom:calc(26px + env(safe-area-inset-bottom))}
</style>
</head>
<body>
<a class="skip" href="#root">Skip to content</a>
<div class="app">
<header>
  <div class="brand">Kondapalli</div>
  <div class="tag">Little toys. Big stories.</div>
  <nav aria-label="Pages">
    <a href="#/" id="n-home" class="on">Books</a>
    <a href="#/craft" id="n-craft">The Craft</a>
  </nav>
</header>
<main id="root"><noscript><p style="padding:30px 0;font-size:16px;line-height:1.5">This page needs JavaScript to show the makers of your book’s figures. Please turn it on and reload.</p></noscript></main>
<footer>A student design project at NID Andhra Pradesh. Artisan details are shared with their consent.</footer>
</div>
<script src="data.js?v=4"></script>
<script>
(function(){
  var D=DATA, root=document.getElementById('root'), trail=[], scrolls={}, first=true;
  var has=function(o,k){return Object.prototype.hasOwnProperty.call(o,k)};
  var esc=function(t){return String(t).replace(/[&<>"]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]})};
  var ARROW='<svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M9 5l7 7-7 7"/></svg>';
  var LEFT='<svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M15 5l-7 7 7 7"/></svg>';
  var STEPS='<div class="step"><em>01</em><div><b>Carved with care</b><span>Shaped by hand from soft Tella Poniki wood.</span></div></div><div class="step"><em>02</em><div><b>Brought to life in color</b><span>Assembled and painted by skilled artisans.</span></div></div>';
  var FOOT='<p class="foot">A living craft. A story worth sharing.</p>';
  function toyCard(id,sub){var t=D.toys[id];return '<a class="card" href="#/toy/'+id+'"><img src="'+t.img+'" alt="" width="423" height="321" loading="lazy"><div class="meta"><div><b>'+esc(t.name)+'</b><small>'+esc(sub)+'</small></div>'+ARROW+'</div></a>';}
  function bookCard(id){var b=D.books[id];return '<a class="bookcard" href="#/book/'+id+'"><img src="'+b.cover+'" alt="" width="900" height="651"><div><b>'+esc(b.title)+'</b><small>'+b.toys.length+' figures</small></div></a>';}
  function craft(){return '<section id="craft"><h1>Small toys,<br>a beautiful tradition.</h1><p class="where">Made in Kondapalli, Andhra Pradesh</p><p class="intro">In a village near Vijayawada, artisans turn lightweight wood into colorful characters. These handmade toys carry stories of animals, village life and Indian traditions.</p><div class="panel"><h2>From wood to wonder</h2>'+STEPS+'<div class="step"><em>03</em><div><b>Made for stories</b><span>Each character invites a little imagination.</span></div></div></div><div class="together"><h3>A little together-time</h3><p>Ask your child: “What adventure will your animal go on today?” Explore its story together.</p></div>'+FOOT+'</section>';}
  function home(){return '<h1 style="font-size:36px;line-height:1.12;margin-top:26px">Which book do you have?</h1><p class="lead" style="font-size:16.5px;line-height:1.5;margin-top:12px">Pick your book to meet the people who made its figures.</p>'+Object.keys(D.books).map(bookCard).join('')+'<p class="more">&nbsp;</p>';}
  function book(id){var b=D.books[id], others=Object.keys(D.books).filter(function(k){return k!==id});
    return '<h1 style="font-size:32px;line-height:1.15;margin-top:24px">'+esc(b.title)+'</h1>'
    +'<div class="bookhead"><img src="'+b.cover+'" alt="Cover of '+esc(b.title)+'" width="900" height="651"><p>The book tells the story. This page is about the people who made its figures.</p></div>'
    +'<h2 class="sub">The figures in your book</h2><p style="font-size:15px;margin-top:6px">Tap a figure to meet the artisan who made it.</p><div class="grid">'+b.toys.map(function(k){return toyCard(k,'By '+D.artisans[D.toys[k].artisan].name)}).join('')+'</div>'
    +(b.talk&&b.talk.length?'<div class="together" style="margin-top:30px"><h3>A little together-time</h3>'+b.talk.map(function(t){return '<p>'+esc(t)+'</p>'}).join('')+'</div>':'')
    +(others.length?'<h2 class="sub">'+(others.length>1?'More books':'Another book')+'</h2>'+others.map(bookCard).join(''):'')+FOOT;}
  function toy(id){var t=D.toys[id], a=D.artisans[t.artisan], b=D.books[t.book], mates=b?b.toys.filter(function(k){return k!==id}):[];
    return (b?'<a class="back" href="#/book/'+t.book+'" data-back>'+LEFT+'Back to the book</a>':'<a class="back" href="#/">'+LEFT+'Back</a>')+'<img class="big" src="'+t.img+'" alt="'+esc(t.name)+', a Kondapalli wooden toy" width="423" height="321"><h1 style="font-size:34px;margin-top:16px">'+esc(t.name)+'</h1>'+(b?'<a class="from" href="#/book/'+t.book+'">From '+esc(b.title)+'</a>':'')
    +(a?'<h2 class="sub">Made by</h2><a class="madeby" href="#/artisan/'+t.artisan+'"><img src="'+a.photo+'" alt="" width="76" height="76"><div><b>'+esc(a.name)+'</b><small>'+esc(a.role)+'</small></div>'+ARROW+'</a>':'')
    +'<div class="panel" style="margin-top:26px"><h2>From wood to wonder</h2>'+STEPS+'</div>'
    +(mates.length?'<h2 class="sub">Also in this book</h2><div class="grid">'+mates.map(function(k){return toyCard(k,'See this figure')}).join('')+'</div>':'')+FOOT;}
  function artisan(id){var a=D.artisans[id], first=esc(a.name.split(' ')[0]), made=Object.keys(D.toys).filter(function(k){return D.toys[k].artisan===id});
    var contact=a.phone?'<a class="btn line" href="tel:'+esc(a.phone)+'">Call '+first+'</a>':'<button class="btn line" data-note="n2" aria-expanded="false" aria-controls="n2">View contact number</button><div class="note" id="n2" role="status">Contact number to be added with the artisan’s consent.</div>';
    var commission=a.whatsapp?'<a class="btn fill" href="https://wa.me/'+esc(a.whatsapp)+'">Request a commission</a>':'<button class="btn fill" data-note="n1" aria-expanded="false" aria-controls="n1">Request a commission</button><div class="note" id="n1" role="status">Commission requests open once the artisan has given consent.</div>';
    return '<a class="back" href="#/" data-back>'+LEFT+'Back</a><img class="portrait" src="'+a.photo+'" alt="Portrait of '+esc(a.name)+'" width="968" height="692"><h1 style="margin-top:18px">'+esc(a.name)+'</h1><div class="role">'+esc(a.role)+'</div><h2>A little about '+first+'</h2><p class="bio">'+esc(a.bio)+'</p>'
    +(made.length?'<h2 class="sub">Figures made by '+first+'</h2><div class="grid">'+made.map(function(k){var bk=D.books[D.toys[k].book];return toyCard(k,bk?bk.short:'')}).join('')+'</div>':'')
    +commission+contact+FOOT;}
  function notFound(){return '<div class="notfound"><h1>We could not find that page</h1><p>The link may be old or mistyped. The makers of your book’s figures are one tap away.</p><a class="btn fill" href="#/">See the books</a></div>';}
  function parse(){var h=location.hash.replace(/^#\/?/,''),q=h.indexOf('?');if(q>-1)h=h.slice(0,q);
    var p=h.split('/').filter(Boolean).map(function(x){try{return decodeURIComponent(x).toLowerCase()}catch(e){return x.toLowerCase()}});return {r:p[0]||'',id:p[1]||''};}
  function render(){
    var cur=location.hash||'#/', prev=trail[trail.length-1];
    if(!first&&prev!==undefined) scrolls[prev]=window.scrollY;
    var goingBack=trail.length>1&&trail[trail.length-2]===cur;
    if(goingBack)trail.pop(); else if(prev!==cur)trail.push(cur);
    var R=parse(), r=R.r, id=R.id, html, title='Kondapalli · Little toys. Big stories.', section=r||'home';
    try{
      if(r==='')html=home();
      else if(r==='craft'){html=craft();title='The Craft · Kondapalli';}
      else if(r==='book'&&has(D.books,id)){html=book(id);title=D.books[id].title+' · Kondapalli';}
      else if(r==='toy'&&has(D.toys,id)){html=toy(id);title=D.toys[id].name+' · Kondapalli';}
      else if(r==='artisan'&&has(D.artisans,id)){html=artisan(id);title=D.artisans[id].name+' · Kondapalli';}
      else{html=notFound();title='Page not found · Kondapalli';section='home';}
    }catch(e){html=notFound();title='Page not found · Kondapalli';section='home';}
    root.innerHTML='<section class="view on" id="'+section+'">'+html+'</section>';
    document.title=title;
    if(r==='craft'){root.firstChild.style.background='var(--sage)';}
    var nc=document.getElementById('n-craft'), nh=document.getElementById('n-home');
    nc.classList.toggle('on',r==='craft'); nh.classList.toggle('on',r!=='craft');
    nc.setAttribute('aria-current',r==='craft'?'page':'false'); nh.setAttribute('aria-current',r!=='craft'?'page':'false');
    root.querySelectorAll('[data-note]').forEach(function(b){b.addEventListener('click',function(){var n=document.getElementById(b.dataset.note),on=n.classList.toggle('on');b.setAttribute('aria-expanded',on)})});
    root.querySelectorAll('[data-back]').forEach(function(l){l.addEventListener('click',function(e){if(trail.length>1){e.preventDefault();history.back();}})});
    window.scrollTo(0,goingBack&&scrolls[cur]?scrolls[cur]:0);
    if(!first){var h1=root.querySelector('h1');if(h1){h1.setAttribute('tabindex','-1');h1.focus({preventScroll:true});}}
    first=false;
  }
  if('scrollRestoration' in history)history.scrollRestoration='manual';
  window.addEventListener('hashchange',render); render();
})();
</script>
</body>
</html>
